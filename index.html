const ROS=[
 "In 1799, during Napoleon's campaign in Egypt, a French soldier named Pierre-François Bouchard made an unexpected discovery in the town of Rosetta. He found a large, dark stone slab inscribed with text. Recognizing its potential importance, the slab was secured. It was immediately clear that this was no ordinary artifact, as it appeared to contain the same text written in three different scripts, presenting a linguistic puzzle that had confused scholars for centuries.",
 "The true value of the Rosetta Stone lay in its trilingual inscription. The top section was written in Ancient Egyptian hieroglyphs, the script of monuments and religious texts which no one at the time could read. The middle section was in Demotic, a more common script used in ancient Egypt for everyday purposes. The bottom section was in Ancient Greek, a language that was well understood by scholars. It was this trilingual format that provided the pivotal clue for finally decoding the lost language of the pharaohs.",
 "For over two decades, many scholars attempted to decipher the hieroglyphs with limited success. The final breakthrough came from a young French scholar named Jean-François Champollion. He had dedicated his life to the study of ancient Egypt and, in 1822, he announced his success. By building on the work of others and applying his own profound knowledge of Coptic (a language descended from Ancient Egyptian), he was able to unlock the secrets of the hieroglyphic script.",
 "Champollion's method was both systematic and brilliant. He hypothesized that the hieroglyphs enclosed in oval shapes, known as cartouches, represented the names of royal figures. By comparing the Greek names of pharaohs like Ptolemy and Cleopatra with the hieroglyphs in the corresponding cartouches, he was able to assign phonetic values to many of the hieroglyphic symbols. This phonetic approach, rather than treating each symbol as a picture of a word, was the crucial step that allowed the entire system to be understood.",
 "The decipherment of the Rosetta Stone was a watershed moment in history. It didn't just allow one text to be read; it opened the door to understanding thousands of other inscriptions and papyri from ancient Egypt. For the first time, historians could read the history, literature, and religious beliefs of the Egyptians in their own words. This single discovery essentially gave birth to the entire field of modern Egyptology and unveiled the complexities of a civilization that had been silent for nearly two millennia.",
 "After the defeat of the French forces in Egypt in 1801, the Rosetta Stone was transferred to British possession under the terms of a treaty. It has been on public display at the British Museum in London since 1802, where it remains the single most visited object. However, its location is a source of ongoing contention, with Egyptian authorities and cultural heritage groups frequently calling for its repatriation to Egypt, arguing it is a vital piece of their national heritage."];

 "Dr. Kalina Christoff, a neuroscientist at the University of British Columbia, has studied the brain activity of people while they daydream. Her research shows that moments of mental drifting can help the brain make unexpected connections, leading to sudden insights. She explains that when the mind is allowed to move freely from one thought to another, it can link distant memories or ideas in original ways — a process that structured, focused thinking often prevents.",

{sec:"L",p:"L",title:"Part 1",from:1,to:8,aud:1,instr:"You will hear some sentences. You will hear each sentence twice. Choose the correct reply to each sentence (A, B, or C).",html:()=>`<div class="card">${[
 ["Me too.","Can you?","Sure, you can."],["Take bus 6.","It starts at 9 a.m. tomorrow.","It's in the center."],["OK, here it is.","No, that doesn't suit you.","Sure, I'll wait here."],["In the school library.","Since 1997.","Before I was born."],["You should take a short break.","Let's get to work right now!","Don't worry, they haven't."],["How about an ice-cream?","You need to wear your sweater.","Let's eat some fresh pizza and chips."],["When does it happen?","Where did you see that?","Who told you that?"],["My hands are also firm.","Sounds like a boring person.","Can you expect anything?"]].map((o,i)=>mcq("L",i+1,"",o)).join("")}</div>`},
{sec:"L",p:"L",title:"Part 2",from:9,to:14,aud:2,instr:"You will hear someone giving a talk. For each question, fill in the missing information in the numbered space. Write ONE WORD and / or A NUMBER for each answer.",html:()=>`<div class="card"><h3 style="margin-top:0">School trip</h3><ul class="bl"><li>Teacher's name: <b><u>Turner</u></b></li>${["They will visit by [[9]]","The first activity they walk around [[10]]","Students spend their free time in the [[11]]","The lunch will be at [[12]] together","They will visit a [[13]]","They should bring a [[14]]."].map(t=>`<li style="margin:10px 0">${gp("L",t)}</li>`).join("")}</ul></div>`},
{sec:"L",p:"L",title:"Part 3",from:15,to:18,aud:3,instr:"You will hear people speaking in different situations. Match each speaker (1-4) to the place they are at (A-F). There are TWO EXTRA options which you do not need to use.",html:()=>`<div class="card"><div class="grid2"><div>${[15,16,17,18].map((n,i)=>`<div class="q"><b>${n}.</b> Speaker ${i+1} … ${sel("L",n,"ABCDEF")}</div>`).join("")}</div><ul class="stm">${["In a swimming pool","At home","In a shopping centre","In a garden","In a restaurant","In a classroom"].map((t,i)=>`<li><b>${LET[i]})</b> ${t}</li>`).join("")}</ul></div></div>`},
{sec:"L",p:"L",title:"Part 4",from:19,to:23,aud:4,instr:"You will hear someone giving a talk. Label the places (19-23) on the map (A-H). There are THREE extra options which you do not need to use.",html:()=>`<div class="card"><h3 style="text-align:center;margin-top:0">COMMUNITY CENTRE PLAN</h3>${mapSVG()}<div class="mapq">${[[19,"Bike racks"],[20,"Kitchen room"],[21,"Music room"],[22,"Shower room"],[23,"Restroom"]].map(([n,t])=>`<label><span><b>${n}.</b> ${t}</span>${sel("L",n,"ABCDEFGH")}</label>`).join("")}</div></div>`},
{sec:"L",p:"L",title:"Part 5",from:24,to:29,aud:5,instr:"You will hear three extracts. Choose the correct answer (A, B or C) for each question (24-29). There are TWO questions for each extract.",html:()=>`<div class="card"><h3 style="margin-top:0">Extract One</h3><p><i>You hear a man and a woman discussing a new facility in their neighborhood.</i></p>${mcq("L",24,"What is the main conversation about?",["A new library and its features","A recent community event","Renovations at the local museum"])}${mcq("L",25,"What is the woman concerned about?",["The lack of seating","There are too many people in the evenings","The opening hours are too short"])}</div><div class="card"><h3 style="margin-top:0">Extract Two</h3><p><i>You hear two friends talking about a coffee shop they visited.</i></p>${mcq("L",26,"What is the main conversation about?",["The menu options at a café","The location of a popular café","The size and atmosphere of a new coffee shop"])}${mcq("L",27,"What did the man say about the new coffee shop?",["The service was slower","The prices were higher","The staff weren't friendlier"])}</div><div class="card"><h3 style="margin-top:0">Extract Three</h3><p><i>You hear a conversation between two people discussing pets.</i></p>${mcq("L",28,"What is the main conversation about?",["The difficulty of taking care of a pet animal","Choosing the right breed for a family","Training a dog to behave indoors"])}${mcq("L",29,"What was the woman's recommendation?",["Going for a smaller one","Buying a pet from a shelter","Hiring a professional trainer"])}</div>`},
{sec:"L",p:"L",title:"Part 6",from:30,to:35,aud:6,instr:"You will hear a part of a lecture. For each question, fill in the missing information in the numbered space. Write no more than ONE WORD for each answer.",html:()=>`<div class="card"><h3 style="margin-top:0">MARKETING AND BRANDING</h3><ul class="bl">${["A strong brand can help a company dominate its [[30]].","Apple products are considered more valuable because of their high [[31]].","Many brands focus less on selling logic and more on selling [[32]].","After drinking Coca-Cola, customers don't notice the ingredients but experience a feeling of [[33]].","Online businesses track customer preferences using [[34]] history.","This data helps improve both the customer experience and overall [[35]]."].map(t=>`<li style="margin:12px 0">${gp("L",t)}</li>`).join("")}</ul></div>`},

{sec:"R",p:"R",title:"Part 1",from:1,to:6,instr:"Read the text. Fill in each gap with ONE word. You must use a word which is somewhere in the rest of the text.",html:()=>`<div class="card text"><h3 style="margin-top:0;text-align:center">THE GREAT WALL OF CHINA</h3>${GREAT.map(t=>`<p style="line-height:2.1">${gp("R",t)}</p>`).join("")}</div>`},
{sec:"R",p:"R",title:"Part 2",from:7,to:14,instr:"Read the texts 7-14 and the statements A-J. Decide which text matches with the situation described in the statements. Each statement can be used ONCE only. There are TWO extra statements which you do not need to use.",html:()=>`<div class="card"><ul class="stm">${STM.map((t,i)=>`<li><b>${LET[i]}.</b> ${t}</li>`).join("")}</ul></div><div class="grid2">${JOBS.map(([n,t,d])=>`<div class="job"><h4>${n}. ${t}</h4><p>${d}</p><div class="pick"><b>Statement:</b>${sel("R",n,"ABCDEFGHIJ")}</div></div>`).join("")}</div>`},
{sec:"R",p:"R",title:"Part 3",from:15,to:20,instr:"Read the text and choose the correct heading for each paragraph from the list of headings below. There are more headings than paragraphs, so you will not use all of them. You cannot use any heading more than once.",html:()=>`<div class="card"><h3 style="margin-top:0;text-align:center">LIST OF HEADINGS</h3><ul class="stm">${HEAD.map((t,i)=>`<li><b>${LET[i]})</b> ${t}</li>`).join("")}</ul></div><div class="card text"><h3 style="margin-top:0;text-align:center">THE ROSETTA STONE</h3>${ROS.map((t,i)=>`<p><b>${["I","II","III","IV","V","VI"][i]}.</b> ${t}</p><p style="margin-top:-4px"><b>${15+i}. Paragraph ${["I","II","III","IV","V","VI"][i]}</b> &nbsp;${sel("R",15+i,"ABCDEFGH")}</p><hr style="border:0;border-top:1px dashed var(--line);margin:12px 0">`).join("")}</div>`},
{sec:"R",p:"R",title:"Part 4",from:21,to:29,instr:"Read the following text for questions 21-29.",html:()=>`<div class="card text"><h3 style="margin-top:0;text-align:center">DAYDREAMING</h3>${paras(DAY)}</div><div class="card"><p class="instr" style="margin-top:0">For questions 21-24, choose the correct answer A, B, C, or D.</p>${mcq("R",21,"What was traditionally believed about daydreaming?",["It improves people's ability to concentrate.","It is a sign of deep thinking and self-awareness.","It stops people from focusing properly on tasks.","It helps people become more productive at work."])}${mcq("R",22,"According to Dr. Christoff, what happens when the mind drifts?",["It becomes unable to connect different ideas.","It finds creative links between thoughts and memories.","It stops processing information altogether.","It repeats the same thought patterns endlessly."])}${mcq("R",23,"What did the experiment involving paperclips demonstrate?",["Daydreaming reduces people's ability to think logically.","Repetitive tasks increase stress and anxiety.","Focused concentration produces better ideas.","A relaxed mental state can enhance creativity."])}${mcq("R",24,"What warning do experts give about daydreaming?",["It can have harmful effects if done excessively.","It always results in emotional stability.","It is less effective than using digital tools.","It should be avoided during leisure activities."])}</div><div class="card"><p class="instr" style="margin-top:0">For questions 25-29, decide if the following statements agree with the information given in the text.</p>${tfng("R",25,"The default mode network becomes inactive when people are daydreaming.")}${tfng("R",26,"Dr. Christoff's research proves that daydreaming increases intelligence levels.")}${tfng("R",27,"Participants who did a boring activity before the creative task failed to generate more unique ideas.")}${tfng("R",28,"Excessive daydreaming can sometimes contribute to adverse emotions.")}${tfng("R",29,"The writer suggests that technology use has reduced opportunities for genuine mental rest.")}</div>`},
{sec:"R",p:"R",title:"Part 5",from:30,to:35,instr:"Read the following text for questions 30-35.",html:()=>`<div class="card text"><h3 style="margin-top:0;text-align:center">THE TELECOMMUTING PARADIGM</h3>${TEL.map(t=>t.startsWith("<span")?`<p>${t}</p>`:`<p>${t}</p>`).join("")}</div><div class="card"><p class="instr" style="margin-top:0">For questions 30-33, fill in the missing information in the numbered spaces. Write no more than ONE WORD and / or A NUMBER for each question.</p><h3 style="text-align:center">THE RISE OF REMOTE WORK</h3><p style="line-height:2.1">${gp("R","The practice of telecommuting is now common in various fields, including the technology and [[30]] sectors. For companies, a key advantage is a reduced need for physical office space. For employees, productivity can see a significant surge of up to [[31]] percent. This increase is partly explained by the removal of the daily [[32]], with the saved time often being redirected into work. From a societal perspective, remote work promotes inclusivity by opening up job opportunities for groups such as caregivers and people living in [[33]] areas.")}</p></div><div class="card"><p class="instr" style="margin-top:0">For questions 34-35, choose the correct answer A, B, C, or D.</p>${mcq("R",34,"According to the text, what is a key psychological driver behind the increased productivity of remote workers?",["They face fewer interruptions from colleagues compared to an office environment.","They feel a sense of obligation to repay the company for the flexibility it provides.","Their performance is more easily and accurately measured through digital tools.","They have access to superior and more personalized technology in their home offices."])}${mcq("R",35,"What does the author imply is a crucial responsibility for companies with a remote workforce?",["To subsidize the cost of home office equipment for all employees.","To actively prevent the potential for employee burnout through targeted support.","To decrease reliance on virtual meetings to combat screen fatigue.","To ensure all employees have equal access to high-speed internet."])}</div>`},

{sec:"W",p:"W",title:"Writing",ids:["W1.1","W1.2","W2"],instr:"Complete all tasks. Word counters show your progress.",html:()=>`<div class="card"><blockquote><b>You are a student at a school that is planning to change the canteen menu. You received an email from the canteen manager.</b><br>Dear Student,<br>We are currently reviewing the school canteen menu and would like to include healthier and more popular food options. What types of food would you like to see more of? Are there any meals or snacks we should remove or improve?<br>Your feedback is important to us.<br>Best regards,<br>Canteen Manager</blockquote></div>
<div class="card"><h3 style="margin-top:0">Task 1.1</h3><p>Write a short email to your friend (who also eats at the school canteen).<br>Say what you think about the food and what changes you would like to see in the menu.<br><b>Write about 50 words.</b></p><textarea data-q="W1.1" data-min="40" data-max="60" placeholder="Dear …"></textarea><div class="wc"></div></div>
<div class="card"><h3 style="margin-top:0">Task 1.2</h3><p>Write an email to the canteen manager.<br>Give your opinion about the current canteen menu and suggest improvements.<br>Mention what kind of food should be added or removed and explain why.<br><b>Write 120–150 words.</b></p><textarea data-q="W1.2" data-min="120" data-max="150" placeholder="Dear Manager, …" style="min-height:220px"></textarea><div class="wc"></div></div>
<div class="card"><h3 style="margin-top:0">Task 2</h3><p>You are participating in an online discussion for language learners.<br>The question is: <i>"Some schools require students to wear uniforms, while others allow casual clothes. Do you think wearing a uniform is a good idea?"</i><br>Post your response, giving reasons and examples.<br><b>Write 180-200 words.</b></p><textarea data-q="W2" data-min="180" data-max="200" placeholder="I think …" style="min-height:280px"></textarea><div class="wc"></div></div>`},

{sec:"S",p:"S",title:"Speaking",ids:[],instr:"Speak aloud. You can record yourself and listen back (microphone permission is required).",html:()=>`<div class="card"><h3 style="margin-top:0">PART 1.1</h3><ul class="bl"><li><b>What do you usually do in your free time?</b></li><li><b>Do you enjoy sports?</b></li><li><b>How often do you go to the gym?</b></li></ul>${rec("1.1")}</div>
<div class="card"><h3 style="margin-top:0">PART 1.2</h3><div class="pics"><div class="pic"><div><span>🏖️👨‍👩‍👧</span>Picture 1 — family on the beach</div></div><div class="pic b"><div><span>🧑‍🤝‍🧑🎉</span>Picture 2 — friends having fun at home</div></div></div><ul class="bl"><li><b>Tell me what you can see in these two pictures.</b></li><li><b>What are the benefits of spending time with friends?</b></li><li><b>Is it important to make friends?</b></li></ul>${rec("1.2")}</div>
<div class="card"><h3 style="margin-top:0">PART 2</h3><div class="pics"><div class="pic c"><div><span>🎸💻</span>Man learning guitar with a laptop</div></div><ul class="bl" style="align-self:center"><li><b>Tell me about the time when you learned a new skill.</b></li><li><b>What was it and how did you learn it?</b></li><li><b>What kinds of skills are most useful in today's world?</b></li></ul></div>${rec("2")}</div>
<div class="card"><h3 style="margin-top:0">PART 3</h3><table class="pc"><tr><td class="h" colspan="2">SOCIAL MEDIA HAS A NEGATIVE IMPACT ON SOCIETY</td></tr><tr><th>Pros:</th><th>Cons:</th></tr><tr><td><ul class="bl"><li>Social media helps people stay connected around the world, making it easier to stay connected with others.</li><li>It provides a platform for sharing information, promoting causes, and raising awareness.</li><li>It can be a tool for entertainment, education, and networking.</li></ul></td><td><ul class="bl"><li>Social media can contribute to feelings of isolation or loneliness.</li><li>It can be a source of misinformation or fake news.</li><li>It can negatively impact mental health, leading to issues like anxiety or low self-esteem.</li></ul></td></tr></table>${rec("3")}</div>`}
];
const SECS={L:"Listening",R:"Reading",W:"Writing",S:"Speaking"};

/* ---------- BUILD ---------- */
const main=$("#main");
PAGES.forEach((pg,i)=>{
  pg.ids=pg.ids||Array.from({length:pg.to-pg.from+1},(_,k)=>pg.p+(pg.from+k));
  const el=document.createElement("section");el.className="page";el.id="pg"+i;
  const label=pg.sec=="L"||pg.sec=="R"?`${SECS[pg.sec]} — ${pg.title}`:SECS[pg.sec];
  const range=pg.from?` <small>(Questions ${pg.from}–${pg.to})</small>`:"";
  el.innerHTML=`<h2>${label}${range}</h2><div class="instr">${pg.instr}</div>${pg.aud?audioCard(pg.aud):""}${pg.html()}`;
  main.appendChild(el);pg.el=el;
});
const tabs=$("#tabs"),sub=$("#sub");
Object.keys(SECS).forEach(k=>{const b=document.createElement("button");b.className="tab";b.textContent=SECS[k];b.dataset.s=k;b.onclick=()=>go(PAGES.findIndex(p=>p.sec==k));tabs.appendChild(b)});

/* restore answers */
function restore(){document.querySelectorAll("[data-q]").forEach(e=>{const v=ans[e.dataset.q];if(v==null)return;if(e.type=="radio")e.checked=e.value==v;else{e.value=v;}});document.querySelectorAll("textarea[data-q]").forEach(wc)}
function wc(t){const n=(t.value.trim().match(/\S+/g)||[]).length,d=t.nextElementSibling;const mn=+t.dataset.min,mx=+t.dataset.max;d.textContent=`${n} words (target ${mn}–${mx})`;d.className="wc"+(n>=mn&&n<=mx?" good":"")}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.q&&t.type!="radio"){ans[t.dataset.q]=t.value.trim();save();if(t.tagName=="TEXTAREA")wc(t);paint()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.q&&t.type=="radio"){ans[t.dataset.q]=t.value;save();paint()}
  if(t.dataset&&t.dataset.au){const f=t.files[0];if(f){const a=$("#au"+t.dataset.au);a.src=URL.createObjectURL(f);a.load();}}});

/* nav */
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(PAGES.length-1,i));
  document.querySelectorAll("audio").forEach(a=>a.pause());
  PAGES.forEach((p,k)=>p.el.classList.toggle("on",k==cur));
  const pg=PAGES[cur];
  tabs.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.s==pg.sec));
  sub.innerHTML="";
  PAGES.forEach((p,k)=>{if(p.sec==pg.sec&&(p.sec=="L"||p.sec=="R")){const b=document.createElement("button");b.className="chip"+(k==cur?" on":"");b.textContent=p.title;b.onclick=()=>go(k);sub.appendChild(b)}});
  sub.style.display=sub.children.length?"flex":"none";
  $("#prev").disabled=cur==0;$("#next").disabled=cur==PAGES.length-1;
  $("#mid").textContent=`${SECS[pg.sec]}${pg.sec=="L"||pg.sec=="R"?" · "+pg.title:""}  (${cur+1}/${PAGES.length})`;
  try{localStorage.setItem("mock1_pg",cur)}catch(e){}
  window.scrollTo({top:0});paint();$("#drawer").classList.remove("on");
}
$("#prev").onclick=()=>go(cur-1);$("#next").onclick=()=>go(cur+1);

/* palette */
const done=id=>ans[id]!=null&&ans[id]!=="";
function paint(){
  let h="";
  ["L","R","W"].forEach(s=>{h+=`<h3>${SECS[s]}</h3><div class="pal">`;PAGES.forEach((p,k)=>{if(p.sec!=s)return;p.ids.forEach(id=>{h+=`<button class="pn${done(id)?" done":""}" data-pg="${k}">${s=="W"?id:id.slice(1)}</button>`})});h+="</div>"});
  $("#sheet").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Savollar xaritasi</b><button class="btn sm ghost" id="cls">✕</button></div>${h}<p><small>Ko'k — javob berilgan. Raqamga bosib o'sha qismga o'ting.</small></p>`;
  $("#cls").onclick=()=>$("#drawer").classList.remove("on");
  $("#sheet").querySelectorAll(".pn").forEach(b=>b.onclick=()=>go(+b.dataset.pg));
}
$("#palBtn").onclick=()=>$("#drawer").classList.add("on");
$("#drawer").onclick=e=>{if(e.target.id=="drawer")$("#drawer").classList.remove("on")};

/* timer */
let sec=+(localStorage.getItem("mock1_t")||0),run=true;
const tick=()=>{const m=String(Math.floor(sec/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");$("#timer").textContent=(run?"⏱ ":"⏸ ")+m+":"+s};
setInterval(()=>{if(run){sec++;try{localStorage.setItem("mock1_t",sec)}catch(e){}tick()}},1000);
$("#timer").onclick=()=>{run=!run;tick()};tick();

/* recorder */
const recs={};
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-recbtn]");if(!b)return;
  const k=b.dataset.recbtn,box=b.parentElement;
  if(recs[k]&&recs[k].state=="recording"){recs[k].stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];
    mr.ondataavailable=x=>ch.push(x.data);
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const a=box.querySelector("audio");a.src=URL.createObjectURL(new Blob(ch,{type:mr.mimeType}));a.hidden=false;box.classList.remove("on");b.textContent="🎙 Qayta yozish"};
    mr.start();recs[k]=mr;box.classList.add("on");b.textContent="⏹ To'xtatish";
  }catch(err){alert("Mikrofonga ruxsat berilmadi yoki qurilma qo'llab-quvvatlamaydi.")}
});

/* finish */
$("#finBtn").onclick=()=>{
  let rows="",tot=0,got=0,kn=Object.keys(KEY).length;
  ["L","R"].forEach(s=>{const ids=PAGES.filter(p=>p.sec==s).flatMap(p=>p.ids);const d=ids.filter(done).length;rows+=`<div>${SECS[s]}: <b>${d}/${ids.length}</b> javob berilgan</div>`});
  const wd=["W1.1","W1.2","W2"].filter(done).length;rows+=`<div>Writing: <b>${wd}/3</b> task yozilgan</div>`;
  let score="";
  if(kn){Object.keys(KEY).forEach(id=>{tot++;if(String(ans[id]||"").toLowerCase()==String(KEY[id]).toLowerCase())got++});score=`<div class="sc">${got} / ${tot}</div><small>Kalit bo'yicha to'g'ri javoblar</small>`}
  $("#mbox").innerHTML=`<h3 style="margin:0">Test yakuni</h3>${rows}${score}<small>Vaqt: ${$("#timer").textContent.slice(2)}</small><button class="btn" id="dl">⬇ Javoblarni yuklab olish (.txt)</button><button class="btn ghost" id="rs">🗑 Hammasini tozalash</button><button class="btn ghost" id="mc">Yopish</button>`;
  $("#modal").classList.add("on");
  $("#mc").onclick=()=>$("#modal").classList.remove("on");
  $("#rs").onclick=()=>{if(confirm("Barcha javoblar o'chiriladi. Davom etasizmi?")){ans={};save();try{localStorage.removeItem("mock1_t")}catch(e){}location.reload()}};
  $("#dl").onclick=()=>{let t="CEFR Mock Test 1 — javoblar\n\n";Object.keys(ans).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(k=>t+=k+": "+ans[k]+"\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="mock1-answers.txt";a.click()};
};

restore();
go(+(localStorage.getItem("mock1_pg")||0));
</script>
</body>
</html>
